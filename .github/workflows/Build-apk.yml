name: Build APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Add Android platform
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $M
          npx cap sync android
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../LiverReset90-v1.0.apk
      - uses: actions/upload-artifact@v4
        with: { name: LiverReset90-v1.0.apk, path: LiverReset90-v1.0.apk }
